# Full-stack orchestration: Nginx (reverse proxy) + Frontend + Backend + PostgreSQL
# Single command to spin up the entire ResQ system for local dev/testing.
# Usage: docker compose up   (from the repo root)
# Access: http://localhost  (frontend)  |  http://localhost/api  (backend API)  |  http://localhost/swagger

services:
  postgres:
    image: postgres:17-alpine
    container_name: resq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resq_dev}
      POSTGRES_DB: ${POSTGRES_DB:-resq_db}
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resq} -d ${POSTGRES_DB:-resq_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - resq-net

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    image: resq-backend:dev
    container_name: resq-backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-resq_db};Username=${POSTGRES_USER:-resq};Password=${POSTGRES_PASSWORD:-resq_dev}"
      Minio__Endpoint: "minio:9000"
      Minio__AccessKey: ${MINIO_ACCESS_KEY:-resq_minio}
      Minio__SecretKey: ${MINIO_SECRET_KEY:-resq_minio_secret}
      Minio__BucketName: "resq-images"
      Minio__UseSSL: "false"
      Minio__PublicBaseUrl: "${MP_FRONTEND_BASE_URL}/storage"
      MercadoPago__ClientId: ${MP_CLIENT_ID}
      MercadoPago__ClientSecret: ${MP_CLIENT_SECRET}
      MercadoPago__PublicKey: ${MP_PUBLIC_KEY}
      MercadoPago__AdminAccessToken: ${MP_ADMIN_ACCESS_TOKEN}
      MercadoPago__RedirectUri: ${MP_REDIRECT_URI}
      MercadoPago__NotificationUrl: ${MP_NOTIFICATION_URL}
      MercadoPago__FrontendBaseUrl: ${MP_FRONTEND_BASE_URL}
      MercadoPago__UseTestMode: ${MP_USE_TEST_MODE:-false}
      Encryption__Key: ${ENCRYPTION_KEY}
      Google__ClientId: ${GOOGLE_CLIENT_ID}
      Smtp__Host: ${SMTP_HOST:-smtp.gmail.com}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__Username: ${SMTP_USERNAME}
      Smtp__Password: ${SMTP_PASSWORD}
      Smtp__FromEmail: ${SMTP_FROM_EMAIL}
      Smtp__FromName: ${SMTP_FROM_NAME:-ResQ}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - resq-net

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    image: resq-frontend:dev
    container_name: resq-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - resq-net

  nginx:
    image: nginx:alpine
    container_name: resq-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - resq-net

  minio:
    image: minio/minio:latest
    container_name: resq-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-resq_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-resq_minio_secret}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console UI (http://localhost:9001)
    volumes:
      - ./.minio-data:/data
    networks:
      - resq-net

volumes:
  pg_data:

networks:
  resq-net:
    driver: bridge
