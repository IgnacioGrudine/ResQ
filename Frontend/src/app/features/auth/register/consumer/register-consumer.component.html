<div class="lg:grid lg:grid-cols-2 min-h-screen">

  <app-auth-left-panel />

  <div class="min-h-screen flex flex-col items-center justify-center px-6 py-12
              max-lg:bg-gradient-to-br max-lg:from-evergreen max-lg:to-hunter lg:bg-gray-50">

    <!-- Logo (mobile only) -->
    <a routerLink="/" class="lg:hidden flex items-center gap-2 mb-8 group">
      <svg lucideLeaf class="w-8 h-8 text-lime"></svg>
      <span class="text-white font-bold text-2xl tracking-tight group-hover:text-lime transition-colors">ResQ</span>
    </a>

    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg p-8">

      <!-- Header -->
      <div class="flex items-center gap-3 mb-7">
        <a routerLink="/register"
           class="w-8 h-8 flex items-center justify-center rounded-full bg-lime text-evergreen hover:bg-palm hover:text-white transition-colors text-sm font-bold">
          ←
        </a>
        <div>
          <h1 class="text-2xl font-bold text-evergreen">Crear cuenta</h1>
          <p class="text-gray-500 text-sm flex items-center gap-1.5"><svg lucideUser class="w-4 h-4"></svg> Consumidor</p>
        </div>
      </div>

      <!-- API Error -->
      @if (apiError()) {
        <div class="mb-5 flex items-start gap-3 bg-red-50 border border-red-200 rounded-xl px-4 py-3">
          <svg lucideTriangleAlert class="w-5 h-5 text-red-500 flex-shrink-0 mt-0.5"></svg>
          <p class="text-red-700 text-sm">{{ apiError() }}</p>
        </div>
      }

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4" novalidate>

        <!-- Nombre y Apellido en fila -->
        <div class="grid grid-cols-2 gap-4">
          <resq-input
            label="Nombre"
            placeholder="Juan"
            [required]="true"
            [errorMessage]="fieldError('firstName')"
            formControlName="firstName"
          />
          <resq-input
            label="Apellido"
            placeholder="Pérez"
            [required]="true"
            [errorMessage]="fieldError('lastName')"
            formControlName="lastName"
          />
        </div>

        <resq-input
          label="Email"
          type="email"
          placeholder="tu@email.com"
          [required]="true"
          [errorMessage]="fieldError('email')"
          formControlName="email"
        />

        <resq-input
          label="Contraseña"
          type="password"
          placeholder="Mínimo 8 caracteres"
          [required]="true"
          [hint]="'Mínimo 8 caracteres.'"
          [errorMessage]="fieldError('password')"
          formControlName="password"
        />

        <resq-input
          label="Teléfono (opcional)"
          type="tel"
          placeholder="+54 9 351 000 0000"
          [errorMessage]="fieldError('phoneNumber')"
          formControlName="phoneNumber"
        />

        <resq-button
          type="submit"
          [loading]="loading()"
          [fullWidth]="true"
          class="mt-2"
        >
          Crear mi cuenta
        </resq-button>

      </form>

      <p class="text-center text-sm text-gray-400 mt-6">
        ¿Ya tenés cuenta?
        <a routerLink="/login" class="text-fern font-semibold hover:text-hunter transition-colors">Iniciá sesión</a>
      </p>

    </div>

  </div>

</div>
