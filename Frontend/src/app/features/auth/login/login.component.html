<div class="lg:grid lg:grid-cols-2 min-h-screen">

  <app-auth-left-panel />

  <div class="min-h-screen flex flex-col items-center justify-center px-6 py-12
              max-lg:bg-gradient-to-br max-lg:from-evergreen max-lg:to-hunter lg:bg-gray-50">

    <!-- Logo (mobile only) -->
    <a routerLink="/" class="lg:hidden flex items-center gap-2 mb-8 group">
      <svg lucideLeaf class="w-8 h-8 text-lime"></svg>
      <span class="text-white font-bold text-2xl tracking-tight group-hover:text-lime transition-colors">ResQ</span>
    </a>

    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8">

      <div class="mb-7">
        <h1 class="text-2xl font-bold text-evergreen">Iniciar sesión</h1>
        <p class="text-gray-500 text-sm mt-1">Bienvenido de vuelta.</p>
      </div>

      <!-- API Error -->
      @if (apiError()) {
        <div class="mb-5 flex items-start gap-3 bg-red-50 border border-red-200 rounded-xl px-4 py-3">
          <svg lucideTriangleAlert class="w-5 h-5 text-red-500 flex-shrink-0 mt-0.5"></svg>
          <p class="text-red-700 text-sm">{{ apiError() }}</p>
        </div>
      }

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-5" novalidate>

        <resq-input
          label="Email"
          type="email"
          placeholder="tu@email.com"
          [required]="true"
          [errorMessage]="fieldError('email')"
          formControlName="email"
        />

        <resq-input
          label="Contraseña"
          type="password"
          placeholder="••••••••"
          [required]="true"
          [errorMessage]="fieldError('password')"
          formControlName="password"
        />

        <div class="text-right -mt-3">
          <a routerLink="/forgot-password" class="text-xs text-gray-400 hover:text-fern transition-colors">
            ¿Olvidaste tu contraseña?
          </a>
        </div>

        <resq-button
          type="submit"
          [loading]="loading()"
          [fullWidth]="true"
          class="mt-1"
        >
          Ingresar
        </resq-button>

      </form>

      <!-- Separator -->
      <div class="relative my-6">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-gray-200"></div>
        </div>
        <div class="relative flex justify-center text-sm">
          <span class="bg-white px-3 text-gray-400">o ingresá como consumidor con</span>
        </div>
      </div>

      <!-- Google Error -->
      @if (googleError()) {
        <div class="mb-4 flex items-start gap-3 bg-red-50 border border-red-200 rounded-xl px-4 py-3">
          <svg lucideTriangleAlert class="w-5 h-5 text-red-500 flex-shrink-0 mt-0.5"></svg>
          <p class="text-red-700 text-sm">{{ googleError() }}</p>
        </div>
      }

      <!-- Google Sign-In button (rendered by GSI SDK) -->
      <div class="flex justify-center">
        <div #googleBtn></div>
      </div>

      <!-- Google is consumer-only — merchants have no Google auth, so this is here to
           remove any ambiguity about what the button above actually signs you into. -->
      <p class="text-center text-xs text-gray-400 mt-2">Los comercios ingresan con email y contraseña.</p>

      <p class="text-center text-sm text-gray-400 mt-6">
        ¿No tenés cuenta?
        <a routerLink="/register" class="text-fern font-semibold hover:text-hunter transition-colors">Registrarte</a>
      </p>

    </div>

  </div>

</div>
