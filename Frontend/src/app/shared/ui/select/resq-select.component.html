<div class="relative">
  <button
    type="button"
    (click)="toggle()"
    [disabled]="isDisabled"
    [class]="'w-full flex items-center justify-between gap-2 px-3.5 py-2.5 rounded-lg border text-sm text-left transition-colors duration-200 focus:outline-none focus:ring-2 disabled:opacity-50 disabled:cursor-not-allowed ' + triggerClasses()">
    <span class="truncate" [class]="selectedLabel() ? '' : placeholderClasses()">
      {{ selectedLabel() || placeholder() }}
    </span>
    <svg lucideChevronDown class="w-4 h-4 shrink-0 transition-transform duration-200" [class.rotate-180]="open()"></svg>
  </button>

  @if (open()) {
    <div class="fixed inset-0 z-30" (click)="close()"></div>

    <div
      class="absolute left-0 right-0 mt-1.5 z-40 bg-white rounded-xl shadow-lg border border-gray-100 overflow-hidden max-h-64 overflow-y-auto"
      (resq-option-select)="onOptionSelect($event)">
      <ng-content />
    </div>
  }
</div>
