<div class="flex min-h-screen bg-gray-50">

  <!-- ─── Sidebar (desktop) ─── -->
  <aside class="hidden md:flex md:flex-col md:w-60 md:fixed md:inset-y-0 bg-evergreen z-20 px-4 py-8 gap-8">
    <a routerLink="/home" class="flex items-center gap-2 px-2">
      <svg lucideLeaf class="w-7 h-7 text-lime"></svg>
      <span class="text-xl font-bold text-white">ResQ</span>
    </a>

    <nav class="flex flex-col gap-1 flex-1">
      <a routerLink="/home"
         [routerLinkActiveOptions]="{ exact: true }"
         routerLinkActive="bg-white/15 !text-white"
         class="flex items-center gap-3 px-4 py-3 rounded-xl text-white/65 hover:bg-white/10 hover:text-white transition-colors font-medium">
        <svg lucideHome class="w-5 h-5 shrink-0"></svg>
        Inicio
      </a>
      <a routerLink="/home/mapa"
         routerLinkActive="bg-white/15 !text-white"
         class="flex items-center gap-3 px-4 py-3 rounded-xl text-white/65 hover:bg-white/10 hover:text-white transition-colors font-medium">
        <svg lucideMap class="w-5 h-5 shrink-0"></svg>
        Mapa
      </a>
      <a routerLink="/home/orders"
         routerLinkActive="bg-white/15 !text-white"
         class="flex items-center gap-3 px-4 py-3 rounded-xl text-white/65 hover:bg-white/10 hover:text-white transition-colors font-medium">
        <svg lucideShoppingBag class="w-5 h-5 shrink-0"></svg>
        Mis Órdenes
      </a>
      <a routerLink="/home/profile"
         routerLinkActive="bg-white/15 !text-white"
         class="flex items-center gap-3 px-4 py-3 rounded-xl text-white/65 hover:bg-white/10 hover:text-white transition-colors font-medium">
        <svg lucideUser class="w-5 h-5 shrink-0"></svg>
        Mi Perfil
      </a>
    </nav>

    <button (click)="logout()"
      class="flex items-center gap-3 px-4 py-3 rounded-xl text-white/50 hover:bg-white/10 hover:text-red-300 transition-colors font-medium w-full">
      <svg lucideLogOut class="w-5 h-5 shrink-0"></svg>
      Cerrar sesión
    </button>

    <p class="text-white/30 text-xs px-2">ResQ &copy; 2025</p>
  </aside>

  <!-- ─── Main content ─── -->
  <main class="flex-1 md:ml-60 pb-20 md:pb-0 min-w-0">
    <router-outlet />
  </main>

  <!-- ─── Bottom nav (mobile) ─── -->
  <nav class="md:hidden fixed bottom-0 inset-x-0 bg-white border-t border-gray-100 z-20">
    <div class="flex items-stretch justify-around h-16 px-1">

      <a routerLink="/home"
         [routerLinkActiveOptions]="{ exact: true }"
         routerLinkActive #rla1="routerLinkActive"
         class="flex flex-1 min-w-0 flex-col items-center justify-center gap-0.5 px-1 pt-2 pb-1 transition-colors"
         [class.text-evergreen]="rla1.isActive"
         [class.text-gray-400]="!rla1.isActive">
        <svg lucideHome class="w-5 h-5 shrink-0"></svg>
        <span class="text-[10px] font-medium leading-none">Inicio</span>
      </a>

      <a routerLink="/home/mapa"
         routerLinkActive #rlaMap="routerLinkActive"
         class="flex flex-1 min-w-0 flex-col items-center justify-center gap-0.5 px-1 pt-2 pb-1 transition-colors"
         [class.text-evergreen]="rlaMap.isActive"
         [class.text-gray-400]="!rlaMap.isActive">
        <svg lucideMap class="w-5 h-5 shrink-0"></svg>
        <span class="text-[10px] font-medium leading-none">Mapa</span>
      </a>

      <a routerLink="/home/orders"
         routerLinkActive #rla2="routerLinkActive"
         class="flex flex-1 min-w-0 flex-col items-center justify-center gap-0.5 px-1 pt-2 pb-1 transition-colors"
         [class.text-evergreen]="rla2.isActive"
         [class.text-gray-400]="!rla2.isActive">
        <svg lucideShoppingBag class="w-5 h-5 shrink-0"></svg>
        <span class="text-[10px] font-medium leading-none">Órdenes</span>
      </a>

      <a routerLink="/home/profile"
         routerLinkActive #rla3="routerLinkActive"
         class="flex flex-1 min-w-0 flex-col items-center justify-center gap-0.5 px-1 pt-2 pb-1 transition-colors"
         [class.text-evergreen]="rla3.isActive"
         [class.text-gray-400]="!rla3.isActive">
        <svg lucideUser class="w-5 h-5 shrink-0"></svg>
        <span class="text-[10px] font-medium leading-none">Perfil</span>
      </a>

      <button (click)="logout()"
        class="flex flex-1 min-w-0 flex-col items-center justify-center gap-0.5 px-1 pt-2 pb-1 text-red-400 transition-colors hover:text-red-500">
        <svg lucideLogOut class="w-5 h-5 shrink-0"></svg>
        <span class="text-[10px] font-medium leading-none">Salir</span>
      </button>

    </div>
  </nav>

</div>

<!-- ── Auto-review modal (z-50, encima de todo el layout) ── -->
@if (pendingOrder() !== null) {
  <div class="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/50 backdrop-blur-sm">
    <div class="bg-white w-full max-w-sm rounded-t-3xl sm:rounded-3xl shadow-2xl overflow-hidden">

      <!-- Banner superior -->
      <div class="bg-evergreen px-6 pt-6 pb-5 text-center">
        <div class="flex justify-center mb-3">
          <div class="w-12 h-12 rounded-full bg-white/15 flex items-center justify-center">
            <svg lucideStar class="w-6 h-6 text-amber-300 fill-amber-300"></svg>
          </div>
        </div>
        <h2 class="text-white font-bold text-lg">¿Cómo estuvo tu pedido?</h2>
        <p class="text-white/70 text-sm mt-1">
          <span class="font-semibold text-white/90">{{ pendingOrder()!.merchantName }}</span>
          — contanos tu experiencia
        </p>
      </div>

      <!-- Body -->
      <div class="px-6 py-5">

        <!-- Estrellas -->
        <div class="flex justify-center gap-3 mb-5">
          @for (star of [1,2,3,4,5]; track star) {
            <button (click)="setRating(star)"
                    (mouseenter)="hoverRating = star"
                    (mouseleave)="hoverRating = 0"
                    class="transition-transform active:scale-90 hover:scale-110">
              <svg lucideStar class="w-10 h-10 transition-colors"
                [class]="(hoverRating || reviewRating) >= star
                  ? 'fill-amber-400 text-amber-400'
                  : 'text-gray-200'">
              </svg>
            </button>
          }
        </div>

        <!-- Comentario -->
        <textarea
          [(ngModel)]="reviewComment"
          placeholder="¿Qué te pareció el pack? (opcional)"
          rows="3"
          maxlength="500"
          class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-700 placeholder-gray-400 resize-none focus:outline-none focus:ring-2 focus:ring-evergreen/30 focus:border-evergreen/50 transition mb-4">
        </textarea>

        <!-- Acciones -->
        <button (click)="submitReview()"
          [disabled]="reviewRating === 0 || submitting"
          class="w-full py-3 rounded-xl font-semibold text-sm transition-all mb-2
                 bg-evergreen text-white hover:bg-evergreen/90
                 disabled:opacity-40 disabled:cursor-not-allowed">
          @if (submitting) {
            <span class="flex items-center justify-center gap-2">
              <span class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
              Enviando...
            </span>
          } @else {
            Enviar reseña
          }
        </button>

        <button (click)="dismiss()"
          class="w-full py-2.5 rounded-xl text-sm font-medium text-gray-400 hover:text-gray-600 hover:bg-gray-50 transition-colors">
          Ahora no
        </button>

      </div>
    </div>
  </div>
}
