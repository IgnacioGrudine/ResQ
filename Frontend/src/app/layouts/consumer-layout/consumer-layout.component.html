<div class="flex min-h-screen bg-gray-50">

  <!-- ─── Sidebar (desktop) ─── -->
  <aside class="hidden md:flex md:flex-col md:w-60 md:fixed md:inset-y-0 bg-evergreen z-20 px-4 py-8 gap-8">
    <a routerLink="/home" class="flex items-center gap-2 px-2">
      <svg lucideLeaf class="w-7 h-7 text-lime"></svg>
      <span class="text-xl font-bold text-white">ResQ</span>
    </a>

    <nav class="flex flex-col gap-1 flex-1">
      <a routerLink="/home"
         [routerLinkActiveOptions]="{ exact: true }"
         routerLinkActive="bg-white/15 !text-white"
         class="flex items-center gap-3 px-4 py-3 rounded-xl text-white/65 hover:bg-white/10 hover:text-white transition-colors font-medium">
        <svg lucideHome class="w-5 h-5 shrink-0"></svg>
        Inicio
      </a>
      <a routerLink="/home/orders"
         routerLinkActive="bg-white/15 !text-white"
         class="flex items-center gap-3 px-4 py-3 rounded-xl text-white/65 hover:bg-white/10 hover:text-white transition-colors font-medium">
        <svg lucideShoppingBag class="w-5 h-5 shrink-0"></svg>
        Mis Órdenes
      </a>
      <a routerLink="/home/profile"
         routerLinkActive="bg-white/15 !text-white"
         class="flex items-center gap-3 px-4 py-3 rounded-xl text-white/65 hover:bg-white/10 hover:text-white transition-colors font-medium">
        <svg lucideUser class="w-5 h-5 shrink-0"></svg>
        Mi Perfil
      </a>
    </nav>

    <p class="text-white/30 text-xs px-2">ResQ &copy; 2025</p>
  </aside>

  <!-- ─── Main content ─── -->
  <main class="flex-1 md:ml-60 pb-20 md:pb-0 min-w-0">
    <router-outlet />
  </main>

  <!-- ─── Bottom nav (mobile) ─── -->
  <nav class="md:hidden fixed bottom-0 inset-x-0 bg-white border-t border-gray-100 z-20">
    <div class="flex items-center justify-around h-16 px-2">

      <a routerLink="/home"
         [routerLinkActiveOptions]="{ exact: true }"
         routerLinkActive #rla1="routerLinkActive"
         class="flex flex-col items-center gap-0.5 px-6 pt-2 pb-1 transition-colors"
         [class.text-evergreen]="rla1.isActive"
         [class.text-gray-400]="!rla1.isActive">
        <svg lucideHome class="w-5 h-5"></svg>
        <span class="text-[10px] font-medium">Inicio</span>
      </a>

      <a routerLink="/home/orders"
         routerLinkActive #rla2="routerLinkActive"
         class="flex flex-col items-center gap-0.5 px-6 pt-2 pb-1 transition-colors"
         [class.text-evergreen]="rla2.isActive"
         [class.text-gray-400]="!rla2.isActive">
        <svg lucideShoppingBag class="w-5 h-5"></svg>
        <span class="text-[10px] font-medium">Órdenes</span>
      </a>

      <a routerLink="/home/profile"
         routerLinkActive #rla3="routerLinkActive"
         class="flex flex-col items-center gap-0.5 px-6 pt-2 pb-1 transition-colors"
         [class.text-evergreen]="rla3.isActive"
         [class.text-gray-400]="!rla3.isActive">
        <svg lucideUser class="w-5 h-5"></svg>
        <span class="text-[10px] font-medium">Perfil</span>
      </a>

    </div>
  </nav>

</div>
