<div class="flex min-h-screen bg-gray-50">

  <!-- ─── Sidebar (desktop) ─── -->
  <aside class="hidden md:flex md:flex-col md:w-60 md:fixed md:inset-y-0 bg-evergreen z-20 px-4 py-8 gap-8">
    <a routerLink="/admin" class="flex items-center gap-2 px-2">
      <svg lucideLeaf class="w-7 h-7 text-lime"></svg>
      <span class="text-xl font-bold text-white">ResQ <span class="text-lime text-sm font-semibold">Admin</span></span>
    </a>

    <nav class="flex flex-col gap-1 flex-1">
      <a routerLink="/admin"
         [routerLinkActiveOptions]="{ exact: true }"
         routerLinkActive="bg-white/15 !text-white"
         class="flex items-center gap-3 px-4 py-3 rounded-xl text-white/65 hover:bg-white/10 hover:text-white transition-colors font-medium">
        <svg lucideLayoutDashboard class="w-5 h-5 shrink-0"></svg>
        Dashboard
      </a>
      <a routerLink="/admin/merchants"
         routerLinkActive="bg-white/15 !text-white"
         class="flex items-center gap-3 px-4 py-3 rounded-xl text-white/65 hover:bg-white/10 hover:text-white transition-colors font-medium">
        <svg lucideStore class="w-5 h-5 shrink-0"></svg>
        Comercios
      </a>
      <a routerLink="/admin/users"
         routerLinkActive="bg-white/15 !text-white"
         class="flex items-center gap-3 px-4 py-3 rounded-xl text-white/65 hover:bg-white/10 hover:text-white transition-colors font-medium">
        <svg lucideUsers class="w-5 h-5 shrink-0"></svg>
        Usuarios
      </a>
      <a routerLink="/admin/reports"
         routerLinkActive="bg-white/15 !text-white"
         class="flex items-center gap-3 px-4 py-3 rounded-xl text-white/65 hover:bg-white/10 hover:text-white transition-colors font-medium">
        <svg lucideFileText class="w-5 h-5 shrink-0"></svg>
        Reportes
      </a>
    </nav>

    <button (click)="logout()"
      class="flex items-center gap-3 px-4 py-3 rounded-xl text-white/50 hover:bg-white/10 hover:text-red-300 transition-colors font-medium w-full">
      <svg lucideLogOut class="w-5 h-5 shrink-0"></svg>
      Cerrar sesión
    </button>

    <p class="text-white/30 text-xs px-2">ResQ &copy; 2025</p>
  </aside>

  <!-- ─── Main content ─── -->
  <main class="flex-1 md:ml-60 pb-20 md:pb-0 min-w-0">
    <router-outlet />
  </main>

  <!-- ─── Bottom nav (mobile) ─── -->
  <nav class="md:hidden fixed bottom-0 inset-x-0 bg-white border-t border-gray-100 z-20">
    <div class="flex items-center justify-around h-16 px-1">

      <a routerLink="/admin"
         [routerLinkActiveOptions]="{ exact: true }"
         routerLinkActive #rla1="routerLinkActive"
         class="flex flex-col items-center gap-0.5 px-4 pt-2 pb-1 transition-colors"
         [class.text-evergreen]="rla1.isActive"
         [class.text-gray-400]="!rla1.isActive">
        <svg lucideLayoutDashboard class="w-5 h-5"></svg>
        <span class="text-[10px] font-medium">Inicio</span>
      </a>

      <a routerLink="/admin/merchants"
         routerLinkActive #rla2="routerLinkActive"
         class="flex flex-col items-center gap-0.5 px-4 pt-2 pb-1 transition-colors"
         [class.text-evergreen]="rla2.isActive"
         [class.text-gray-400]="!rla2.isActive">
        <svg lucideStore class="w-5 h-5"></svg>
        <span class="text-[10px] font-medium">Comercios</span>
      </a>

      <a routerLink="/admin/users"
         routerLinkActive #rla3="routerLinkActive"
         class="flex flex-col items-center gap-0.5 px-4 pt-2 pb-1 transition-colors"
         [class.text-evergreen]="rla3.isActive"
         [class.text-gray-400]="!rla3.isActive">
        <svg lucideUsers class="w-5 h-5"></svg>
        <span class="text-[10px] font-medium">Usuarios</span>
      </a>

      <a routerLink="/admin/reports"
         routerLinkActive #rla4="routerLinkActive"
         class="flex flex-col items-center gap-0.5 px-4 pt-2 pb-1 transition-colors"
         [class.text-evergreen]="rla4.isActive"
         [class.text-gray-400]="!rla4.isActive">
        <svg lucideFileText class="w-5 h-5"></svg>
        <span class="text-[10px] font-medium">Reportes</span>
      </a>

      <button (click)="logout()"
        class="flex flex-col items-center gap-0.5 px-4 pt-2 pb-1 text-red-400 transition-colors hover:text-red-500">
        <svg lucideLogOut class="w-5 h-5"></svg>
        <span class="text-[10px] font-medium">Salir</span>
      </button>

    </div>
  </nav>

</div>
