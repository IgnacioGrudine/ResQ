upstream backend  { server backend:8080;  }
upstream frontend { server frontend:80; }

server {
    listen 80;
    server_name _;

    # ── API ──────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Swagger + OpenAPI spec (dev only) ───────────────────────────────────
    location /swagger {
        proxy_pass         http://backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location /openapi/ {
        proxy_pass         http://backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # ── MinIO object storage (images) ───────────────────────────────────────
    # Proxied through nginx so image URLs are relative to the app host,
    # making them work on both localhost and ngrok without env changes.
    #
    # CORS is wide open here on purpose: this bucket is public-read, GET-only,
    # image data with no per-user or sensitive content, and the frontend fetches
    # these cross-origin (e.g. app loaded from localhost, image served through the
    # ngrok tunnel) using SafeImgDirective to work around ngrok's free-tier
    # browser-warning interstitial, which a plain <img src> can't bypass.
    location /storage/ {
        # MinIO reflects its own Access-Control-* headers on every response (a side effect
        # of the public-read bucket policy). Hide them so ours below are the only ones sent —
        # a response with two Access-Control-Allow-Origin values is invalid CORS and browsers
        # reject it outright.
        proxy_hide_header  Access-Control-Allow-Origin;
        proxy_hide_header  Access-Control-Allow-Methods;
        proxy_hide_header  Access-Control-Allow-Headers;
        proxy_hide_header  Access-Control-Allow-Credentials;
        proxy_hide_header  Access-Control-Expose-Headers;

        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "ngrok-skip-browser-warning" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_pass         http://minio:9000/;
        proxy_set_header   Host              minio:9000;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # ── Frontend SPA ─────────────────────────────────────────────────────────
    location / {
        proxy_pass         http://frontend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
}
